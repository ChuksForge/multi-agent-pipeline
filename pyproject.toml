[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "multi-agent-pipeline"
version = "0.1.0"
description = "Production-grade multi-agent data pipeline: ETL, analysis, and report generation with LangGraph orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",

    # LLM providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # Data layer
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "sqlalchemy>=2.0.0",

    # ML / anomaly detection
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",

    # Schema / validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Output rendering
    "jinja2>=3.1.0",
    "markdown>=3.7.0",

    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "rich>=13.8.0",
    "tenacity>=9.0.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=62.0",
    "pypandoc>=1.13",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[project.scripts]
pipeline-demo = "pipeline.scripts.run_demo:main"
pipeline-eval = "pipeline.scripts.run_evals:main"
pipeline-benchmark = "pipeline.scripts.cost_benchmark:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short --cov=src/pipeline --cov-report=term-missing"
filterwarnings = [
    "ignore::UserWarning:pydantic",
    "ignore::DeprecationWarning:pydantic",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/pipeline"]
omit = ["*/tests/*", "*/__init__.py"]
